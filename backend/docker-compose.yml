version: '3.8'

services:
  # Konfigurasi Database MySQL
  db:
    image: mysql:8.0
    container_name: portfolio-mysql
    restart: always
    environment:
      # Password diambil otomatis dari file .env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: portfolio_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Konfigurasi Backend NestJS
  api:
    build: .
    container_name: portfolio-backend
    restart: always
    ports:
      - "3000:3000"
    # Mengambil otomatis semua env variable dari file .env di directory ini
    env_file:
      - .env
    depends_on:
      - db

volumes:
  mysql_data:
